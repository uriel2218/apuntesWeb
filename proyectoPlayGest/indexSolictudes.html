<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayGest - Gestión de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="img/logo2.jpg" alt="Logo PlayGest" width="40" height="40" class="rounded-circle object-fit-cover">
                <span class="fs-4 fw-normal text-dark">PlayGest</span>
            </a>
            
            <div class="d-none d-lg-flex align-items-center gap-3 ms-4">
                <button class="btn btn-outline-primary rounded-3 px-3">
                    <i class="bi bi-house-door me-2"></i>Inicio
                </button>
                <button class="btn btn-outline-primary rounded-3 px-3">
                    <i class="bi bi-code-slash me-2"></i>Juegos
                </button>
                <button class="btn btn-outline-primary rounded-3 px-3">
                    <i class="bi bi-briefcase me-2"></i>Realizar Préstamo
                </button>
            </div>

            <div class="ms-auto">
                <span class="badge rounded-pill bg-danger px-3 py-2 fw-normal">
                    <i class="bi bi-shield-lock me-1"></i> Modo Administrador
                </span>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1">Solicitudes Pendientes</h3>
                        <p class="text-muted small mb-0">Revisa y gestiona las peticiones de préstamo de juegos.</p>
                    </div>
                    <span id="contadorSolicitudes" class="badge bg-primary rounded-circle p-3 d-flex align-items-center justify-content-center fs-6" style="width: 35px; height: 35px; background-color: #2435b3 !important;">
                        0
                    </span>
                </div>

                <div id="contenedorSolicitudes" class="list-group shadow-sm border-0 rounded-4 overflow-hidden" style="min-height: 150px; background-color: #ffffff;">
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/main.js"></script>
</body>
</html>
