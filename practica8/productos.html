<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veterinaria Patitas Felices</title>
  <link rel="stylesheet" href="styles.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <header>
    <img class="logo" src="img/logo.jpg" alt="Logo de veterinaria">
    <h1> Veterinaria Patitas Felices</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="index.html#servicios">Servicios</a>
    <a href="index.html#agenda">Citas</a>
    <a href="productos.html">Productos</a>
  </nav>

  <main class="container mt-4">
    <h2 class="text-center mb-4">Tienda veterinaria</h2>

    <div class="row">
      <div class="col-md-4">
        <div class="card text-center p-3">
          <h5>Correa</h5>
          <p>$200</p>
          <button class="btn btn-primary" onclick="agregar(1)">Agregar</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-center p-3">
          <h5>Shampoo</h5>
          <p>$150</p>
          <button class="btn btn-primary" onclick="agregar(2)">Agregar</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card text-center p-3">
          <h5>Juguete</h5>
          <p>$300</p>
          <button class="btn btn-primary" onclick="agregar(3)">Agregar</button>
        </div>
      </div>
    </div>

    <hr>

    <h3>Carrito</h3>

    <ul id="listaCarrito" class="list-group mb-3"></ul>

    <p id="contador"></p>
    <p id="total"></p>

    <button class="btn btn-warning" onclick="vaciarCarrito()">
      Vaciar carrito
    </button>

  </main>
  </div>

  <footer>
    <p>Veterinaria - Proyecto de práctica</p>
  </footer>

  <script src="carrito.js"></script>
</body>
</html>
